backend:
  name: github
  repo: ryp-max/clayroom
  branch: main
  base_url: https://clayroom-three.vercel.app
  auth_endpoint: api/auth

site_url: https://clayroom-three.vercel.app
display_url: https://clayroom-three.vercel.app
logo_url: /images/pendant-lamps.jpg

media_folder: "images"
public_folder: "images"

collections:
  - name: "studios"
    label: "Studios"
    files:
      - name: "studios"
        label: "Studio Directory"
        file: "content/studios.json"
        fields:
          - label: "Studios"
            name: "studios"
            widget: "list"
            summary: "{{name}} ({{status}})"
            fields:
              - { label: "ID (slug, lowercase, no spaces)", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Status", name: "status", widget: "select", options: ["open", "coming-soon"] }
              - { label: "Tag (short label on the card)", name: "tag", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Address", name: "address", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Hours", name: "hours", widget: "string", required: false, hint: "Only for open studios, e.g. Mon-Sat 10am-9pm, Sun 10am-7:30pm" }
              - { label: "Interest email (coming-soon studios only)", name: "interestEmail", widget: "string", required: false }
              - { label: "Interest email subject (coming-soon studios only)", name: "interestSubject", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "imageAlt", widget: "string" }
              - { label: "Offers", name: "medium", widget: "select", multiple: true, options: ["pottery", "woodworking"] }
              - { label: "Homepage card subtitle", name: "pickerSubtitle", widget: "string" }
              - { label: "Classes link (open studios only)", name: "classesLink", widget: "string", required: false, hint: "Usually classes.html, or classes.html#woodworking for SoMa" }

  - name: "classes"
    label: "Classes"
    files:
      - name: "classes"
        label: "Class Listings"
        file: "content/classes.json"
        fields:
          - label: "6-Week Courses"
            name: "sixWeekCourses"
            widget: "list"
            summary: "{{name}} - {{price}}"
            fields:
              - { label: "Level", name: "level", widget: "select", options: ["Beginner", "Intermediate", "Advanced"] }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Duration", name: "duration", widget: "string" }
          - label: "Shorter Sessions (3-week / one-off)"
            name: "shortSessions"
            widget: "list"
            summary: "{{name}} - {{price}}"
            fields:
              - { label: "Level", name: "level", widget: "select", options: ["Beginner", "Intermediate", "Advanced"] }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Duration", name: "duration", widget: "string" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "imageAlt", widget: "string" }

  - name: "membership"
    label: "Membership"
    files:
      - name: "membership"
        label: "Membership Tiers"
        file: "content/membership.json"
        fields:
          - label: "General Membership (Ceramic)"
            name: "general"
            widget: "object"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - label: "Pricing Rows"
                name: "rows"
                widget: "list"
                summary: "{{term}}"
                fields:
                  - { label: "Term", name: "term", widget: "string" }
                  - { label: "Individual Price", name: "individual", widget: "string" }
                  - { label: "Family Price", name: "family", widget: "string" }
          - label: "Woodshop-Only Membership"
            name: "woodshop"
            widget: "object"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - label: "Pricing Rows"
                name: "rows"
                widget: "list"
                summary: "{{term}}"
                fields:
                  - { label: "Term", name: "term", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
          - label: "Working Artist Membership"
            name: "workingArtist"
            widget: "object"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - label: "Pricing Rows"
                name: "rows"
                widget: "list"
                summary: "{{term}}"
                fields:
                  - { label: "Term", name: "term", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }

  - name: "workshops"
    label: "Workshops"
    files:
      - name: "workshops"
        label: "Workshop Schedule"
        file: "content/workshops.json"
        fields:
          - label: "Recurring Workshops"
            name: "recurring"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Schedule", name: "schedule", widget: "string" }
          - label: "Upcoming Workshops"
            name: "upcoming"
            widget: "list"
            summary: "{{name}} - {{dates}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Dates", name: "dates", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }

  - name: "team-events"
    label: "Team Events"
    files:
      - name: "team-events"
        label: "Team Event Packages"
        file: "content/team-events.json"
        fields:
          - label: "Clay Packages"
            name: "clayPackages"
            widget: "list"
            summary: "{{name}} - {{price}}"
            fields:
              - { label: "Package Code", name: "code", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Unit", name: "unit", widget: "string" }
          - label: "Woodworking Packages"
            name: "woodworkingPackages"
            widget: "list"
            summary: "{{name}} - {{price}}"
            fields:
              - { label: "Package Code", name: "code", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Unit", name: "unit", widget: "string" }

  - name: "kids"
    label: "Kids Programs"
    files:
      - name: "kids"
        label: "Kids Programs"
        file: "content/kids.json"
        fields:
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Age / Grade Tag", name: "tag", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price (leave blank if no set price)", name: "price", widget: "string", required: false }
              - { label: "Unit (used with Price)", name: "unit", widget: "string", required: false }
              - { label: "Meta line (used instead of Price, e.g. \"New for 2026 · 6 weeks\")", name: "meta", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "imageAlt", widget: "string" }
